name: Build and push cv-extractor

# ============================================================
# Trigger: push su main che toccano il codice del microservizio
# ============================================================
on:
  push:
    branches: [main]
    paths:
      - 'cv-extractor/**'
      - '.github/workflows/build-push.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cv-extractor/**'
      - '.github/workflows/build-push.yml'
  workflow_dispatch:  # trigger manuale da UI GitHub

# ============================================================
# Permessi: scrivere su GHCR
# ============================================================
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/cv-extractor

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Setup Buildx (build multi-arch + cache)
      # ------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------
      # Login su GHCR (solo su push, non su PR)
      # ------------------------------------------------------
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------
      # Metadata (tag + labels automatici)
      # ------------------------------------------------------
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # ------------------------------------------------------
      # Build + push
      # ------------------------------------------------------
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./cv-extractor
          file: ./cv-extractor/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64      # ← solo amd64
          provenance: false           # ← rimuovi attestazione
          sbom: false                 # ← rimuovi SBOM