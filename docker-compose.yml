# ============================================================
# Stack: cv-preflight
# Blocco 1+2: preflight check + estrazione LLM
# Stack autoportante per test (n8n isolato)
# ============================================================

services:

  # ----------------------------------------------------------
  # Microservizio FastAPI: preflight + estrazione testo
  # ----------------------------------------------------------
  cv-extractor:
    image: ghcr.io/davidenas/cv-preflight/cv-extractor:latest
    container_name: cv-preflight-extractor
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - TESSERACT_LANGS=ita+eng
      - LOG_LEVEL=INFO
      - MAX_UPLOAD_MB=20
    volumes:
      - cv-extractor-tmp:/tmp/cv-work
      - cv-extractor-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - cv-preflight-net
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G

  # ----------------------------------------------------------
  # n8n: orchestratore (ISOLATO per cv-preflight)
  # ----------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: cv-preflight-n8n
    restart: unless-stopped
    ports:
      - "5679:5678"   # ← porta host 5679 (il n8n del sito usa 5678)
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5679/
      - GENERIC_TIMEZONE=Europe/Rome
      - TZ=Europe/Rome
      - N8N_SECURE_COOKIE=false
      - NODES_EXCLUDE=[]
      - N8N_LOG_LEVEL=info
      - DB_TYPE=sqlite
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false           # ← unlock access restriction
      - N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES=false     # ← unlock access restriction
      - N8N_RESTRICT_FILE_ACCESS_TO=/data            # ← unlock access restriction
      - NODE_FUNCTION_ALLOW_EXTERNAL=axios           # ← used to call api on different container
    volumes:
      - cv-preflight-n8n-data:/home/node/.n8n
      - /opt/cv-test-data:/data/local-test-cvs:ro  # ← CV di test accessibili
    networks:
      - cv-preflight-net

  # ----------------------------------------------------------
  # Mailpit: email di test (SMTP + UI web)
  # ----------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: cv-preflight-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # UI web
      - "1026:1025"   # ← SMTP host 1026 (il mailpit del sito usa 1025)
    environment:
      - MP_MAX_MESSAGES=500
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    volumes:
      - mailpit-data:/data
    networks:
      - cv-preflight-net

volumes:
  cv-extractor-tmp:
  cv-extractor-logs:
  cv-preflight-n8n-data:
  mailpit-data:

networks:
  cv-preflight-net:
    driver: bridge